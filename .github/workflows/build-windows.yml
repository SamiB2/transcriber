name: Build Windows executable

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      # Bundle the `base` model so the exe works offline out of the box.
      - run: python -c "from faster_whisper.utils import download_model; download_model('base', output_dir='models/base')"
      # --onedir (exe + _internal/ folder) starts instantly; --onefile would
      # unpack the whole app and model to a temp folder on every launch.
      - run: pyinstaller --onedir --windowed --name Transcriber --collect-all tkinterdnd2 --collect-all ctranslate2 --collect-all faster_whisper --collect-all ttkbootstrap --collect-all certifi --collect-all soundcard --add-data "models;models" transcribe.py
      - uses: actions/upload-artifact@v4
        with:
          name: Transcriber-windows
          path: dist/Transcriber/
