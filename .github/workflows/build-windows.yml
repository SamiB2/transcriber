name: Build Windows executable

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --onefile --windowed --name Transcriber --collect-all tkinterdnd2 --collect-all ctranslate2 --collect-all faster_whisper transcribe.py
      - uses: actions/upload-artifact@v4
        with:
          name: Transcriber-windows
          path: dist/Transcriber.exe
